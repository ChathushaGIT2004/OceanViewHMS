<!-- ========== ORIGINAL SCRIPT (FETCH METHODS, VARIABLES UNTOUCHED) ========== -->
<script>
    const BaseUSL = "http://localhost:8080/Ocean-View-System";   // original variable kept
    const token = sessionStorage.getItem("token");

    let allGuests=[], allReservations=[], allBillings=[];
    let allRooms=[], selectedRooms=[], roomTypes=[];

    // -------------------- ON LOAD --------------------
    window.onload = async function(){
        
        await fetchReservations();
        await loadBillings();
         
    };

  
    
     

    // -------------------- FETCH RESERVATIONS --------------------
    async function fetchReservations(){
        try{
            const res = await fetch(`${BaseUSL}/api/reservations`);
            allReservations = await res.json();
            updateDashboardMetrics();
        }catch(e){console.error(e);}
    }

    // -------------------- FETCH BILLINGS --------------------
    async function loadBillings(){
        try{
            const res = await fetch(`${BaseUSL}/api/billing/all`);
            allBillings = await res.json();
            updateDashboardMetrics();
        }catch(e){console.error(e);}
    }

    // -------------------- UPDATE DASHBOARD METRICS --------------------
    function updateDashboardMetrics(){
        
        document.getElementById("totalReservations").innerText = allReservations.length;
        document.getElementById("activeReservations").innerText = allReservations.filter(r=>r.status==="Confirmed"||r.status==="CheckedIn").length;
        document.getElementById("paidBills").innerText = allBillings.filter(b=>b.paymentStatus==="Paid").length;
        document.getElementById("pendingBills").innerText = allBillings.filter(b=>b.paymentStatus!=="Paid").length;
    }

    

    async function fetchAvailableRooms(){
        try{
            const res = await fetch(`${BaseUSL}/api/rooms?available=true`);
            allRooms = await res.json();
        }catch(e){allRooms=[];}
        filterRooms();
    }

    window.onload = async function () {
     
   

    if (hasFeature("VIEW_RESERVATIONS")) {
        await fetchReservations();
    }

    if (hasFeature("VIEW_BILLING")) {
        await loadBillings();
    }

     

    InitializeDashboardComponents();
};
 
function InitializeDashboardComponents() {
     
    const card = {
        allReservations: document.getElementById("cardTotalReservation"),
        activeReservations: document.getElementById("cardActiveReservation"),
        paidBills: document.getElementById("cardPaidBills"),
        pendingBills: document.getElementById("cardPendingBills")
    };

    const cta = {
        createReservation: document.getElementById("ctaCreateReservation"),
        viewGuests: document.getElementById("ctaViewGuests"),
        manageRooms: document.getElementById("ctaManageRooms"),
        billing: document.getElementById("ctaBilling")
    };

    // -------------------- CTA Buttons --------------------
    if (!hasFeature("CREATE_RESERVATION")) cta.createReservation.style.display = "none";
    if (!hasFeature("VIEW_GUESTS")) cta.viewGuests.style.display = "none";
    if (!hasFeature("CREATE_ROOM") && !hasFeature("UPDATE_ROOM") && !hasFeature("DELETE_ROOM")) cta.manageRooms.style.display = "none";
    if (!hasFeature("CREATE_BILLING") && !hasFeature("VIEW_BILLING")) cta.billing.style.display = "none";

    // -------------------- Metrics --------------------
    if (!hasFeature("VIEW_RESERVATIONS")) {
        card.allReservations.style.display = "none";
        card.activeReservations.style.display = "none";
    }
    if (!hasFeature("VIEW_BILLING")) {
        card.paidBills.style.display = "none";
        card.pendingBills.style.display = "none";
    }
    if(!hasFeature("ACESS_GUEST_PAGE")){
       cta.viewGuests.style.display = "none";

       {}
}
}      
    
     

     
</script>
